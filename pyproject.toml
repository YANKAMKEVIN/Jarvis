[project]
name = "jarvis"
version = "0.9.0"
description = "Local Jarvis assistant with an isolated LiveKit Gemini Live POC."
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7"]
desktop = ["PySide6>=6.8,<7", "pypdf>=6,<7", "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'", "pyobjc-framework-AVFoundation>=11,<13; sys_platform == 'darwin'"]
live = ["livekit-agents[google]>=1.8.8,<1.9", "google-genai>=2.30.1,<3", "sounddevice>=0.5,<1", "python-dotenv>=1,<2"]
mcp = ["mcp>=1.10,<2", "PyYAML>=6,<7"]
telegram = ["telethon>=1.40,<2"]
wake = ["openwakeword>=0.6,<0.7"]
# Optional planner brain to compare with the local default (JARVIS_PLANNER_BACKEND=claude).
claude = ["anthropic>=2.13,<3"]

[project.scripts]
jarvis-desktop = "jarvis.desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.desktop" = ["assets/icons/*.svg", "assets/avatars/*.webp", "assets/avatars/README.md"]

[tool.ruff]
target-version = "py313"
line-length = 200

[tool.ruff.lint]
# F: unused imports and names, undefined names; E9: syntax errors; E501: unreadable lines;
# BLE001: new blind `except Exception`. The per-file list below is the starting baseline
# (code written before ruff): shrink it, never grow it.
select = ["F", "E9", "E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001", "E501", "F811", "F841"]  # fixtures shadowing, Qt app references
"src/jarvis/desktop/**" = ["E501"]  # compressed Qt view code
"scripts/diagnose_accessibility.py" = ["BLE001"]
"scripts/diagnose_desktop_voice.py" = ["BLE001"]
"scripts/diagnose_experience_live.py" = ["BLE001", "E501"]
"scripts/smoke_test.py" = ["BLE001"]
