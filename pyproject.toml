[project]
name = "jarvis"
version = "0.9.0"
description = "Local Jarvis assistant with an isolated LiveKit Gemini Live POC."
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7"]
typecheck = ["mypy>=1.13,<3"]
desktop = ["PySide6>=6.8,<7", "pypdf>=6,<7", "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'", "pyobjc-framework-AVFoundation>=11,<13; sys_platform == 'darwin'"]
live = ["livekit-agents[google]>=1.8.8,<1.9", "google-genai>=2.30.1,<3", "sounddevice>=0.5,<1", "python-dotenv>=1,<2"]
mcp = ["mcp>=1.10,<2", "PyYAML>=6,<7"]
telegram = ["telethon>=1.40,<2"]
wake = ["openwakeword>=0.6,<0.7"]

[project.scripts]
jarvis-desktop = "jarvis.desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.desktop" = ["assets/icons/*.svg", "assets/avatars/*.webp", "assets/avatars/README.md"]

# Progressive typing: mypy runs in CI on the modules listed in `files`. New
# modules join the list (and should pass in strict-ish mode); older modules are
# added one by one as they get cleaned up, without blocking on the whole code.
[tool.mypy]
python_version = "3.13"
platform = "darwin"  # same verdict locally (Linux) and in CI (macOS)
files = [
    "src/jarvis/live/registry.py",
    "src/jarvis/live/registry_base.py",
    "src/jarvis/live/registry_runtime.py",
    "src/jarvis/live/registry_factory.py",
    "src/jarvis/live/debug_results.py",
    "src/jarvis/live/policy.py",
    "src/jarvis/live/toolsets",
    "src/jarvis/routing.py",
    "src/jarvis/intents.py",
    "src/jarvis/security.py",
    "scripts/check_file_sizes.py",
]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# Pure, small modules are held to fully annotated signatures.
[[tool.mypy.overrides]]
module = ["jarvis.routing", "jarvis.intents", "jarvis.security", "jarvis.live.policy",
          "jarvis.live.toolsets", "check_file_sizes"]
disallow_untyped_defs = true
check_untyped_defs = true
