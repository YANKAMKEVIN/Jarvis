      <stop offset="0" stop-color="#1b3347"/>
      <stop offset="0.55" stop-color="#0c1826"/>
      <stop offset="1" stop-color="#060c15"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#87e3ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#5fb8e6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5fb8e6" stop-opacity="0"/>
