    <ellipse cx="512" cy="512" rx="262" ry="96" stroke="#bea5ff" stroke-opacity="0.75" stroke-width="10" transform="rotate(-28 512 512)"/>
    <ellipse cx="512" cy="512" rx="262" ry="96" stroke="#87e3ff" stroke-opacity="0.85" stroke-width="10" transform="rotate(32 512 512)"/>
  </g>
  <circle cx="512" cy="512" r="128" fill="url(#core)"/>
  <circle cx="512" cy="512" r="128" fill="none" stroke="#e8f8ff" stroke-opacity="0.6" stroke-width="4"/>
  <circle cx="742" cy="368" r="15" fill="#e8f8ff"/>
