name: Regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[desktop,live,test]'
      - run: python -m pip check
      - name: Offline tests and branch coverage
        run: python -m pytest -m 'not live' -q --cov=jarvis --cov-branch --cov-report=xml:coverage.xml --cov-report=json:coverage.json --junitxml=tests.xml
      - name: Search coverage gate
        run: python -m coverage report --include='src/jarvis/knowledge/service.py,src/jarvis/knowledge/keyless.py,src/jarvis/capabilities/knowledge.py' --fail-under=90
      - name: Check tests detect deliberately broken protections
        run: python scripts/check_regression_sensitivity.py --json mutations.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            coverage.json
            tests.xml
            mutations.json
          retention-days: 14
